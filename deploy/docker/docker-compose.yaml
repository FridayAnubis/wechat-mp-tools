# 公众号 + RSS 服务（默认形态）
#
#   cd deploy/docker
#   cp .env.example .env
#   mkdir -p data
#   docker compose up -d --build
#   浏览器打开 http://<服务器IP>:5200
#
# 要全功能版（含抖音/快手/小红书/B站/转码），改 .env：
#   DOCKERFILE=deploy/docker/Dockerfile.full
#   IMAGE=wechat-mp-tools-full:latest
#   MEMORY_LIMIT=2g
# 然后重新 up -d --build。

name: wechat-mp-rss

services:
  app:
    build:
      context: ../..
      # 默认公众号版；改成 Dockerfile.full 即全功能版
      dockerfile: ${DOCKERFILE:-deploy/docker/Dockerfile}
      args:
        # 0 = 默认精简镜像（无 Chromium / 无 ffmpeg，公众号抓取与 RSS 不受影响）
        # 1 = 带 Chromium，PDF 导出与风控兜底可用，体积大 1.5GB
        INSTALL_BROWSERS: "${INSTALL_BROWSERS:-0}"
    image: ${IMAGE:-wechat-mp-tools-mp:latest}
    container_name: wechat-mp-rss
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORT: "5200"
      # 宿主机上 ./data 对应的路径，仅用于「打开文件夹」时的提示文案
      HOST_DATA_DIR: ${HOST_DATA_DIR:-./data}
      # 可选：强制指定容器内下载目录（默认 /app/data/articles_full）
      # 迁移旧数据时，若设置里记的是别的机器路径，会自动回落到这里
      DOWNLOAD_DIR: ${DOWNLOAD_DIR:-}
      # RSS：不设则读 data/app_settings.json，再退回代码默认值
      RSS_MAX_ITEMS: ${RSS_MAX_ITEMS:-0}
      RSS_CACHE_TTL: ${RSS_CACHE_TTL:-300}
      RSS_TOKEN: ${RSS_TOKEN:-}
      RSS_BASE_URL: ${RSS_BASE_URL:-}
      RSS_LOCAL_AVATAR: ${RSS_LOCAL_AVATAR:-1}
      RSS_AVATAR_FROM_ARTICLE: ${RSS_AVATAR_FROM_ARTICLE:-1}
      BACKFILL_ADMIN_TOKEN: ${BACKFILL_ADMIN_TOKEN:-}
    ports:
      # 默认只绑本机，配合 Nginx 反代；要局域网直连改成 0.0.0.0
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-5200}:5200"
    volumes:
      # 唯一需要持久化的目录：设置、账号 cookie、下载历史、RSS 缓存、已下载文章及 backfill.db
      - ./data:/app/data
      # 想把文章落到独立磁盘时，把设置里的 download_dir 改成 /downloads 再启用：
      # - ${DOWNLOAD_DIR:-./downloads}:/downloads
    # 默认 root 运行，避免绑定挂载的属主问题。
    # 需要非 root 时取消注释，并先 sudo chown -R 1000:1000 ./data
    # 注意：非 root 下 Chrome 沙箱仍可能不可用，PDF 导出可能失败
    # user: "${PUID:-1000}:${PGID:-1000}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5200/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-1g}
