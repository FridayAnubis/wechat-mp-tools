# WeRSS 反向代理示例（Nginx）
# 放到 /etc/nginx/conf.d/we-rss.conf，替换 rss.example.com 后 nginx -t && nginx -s reload
#
# 要点：
#   1. RSS_BASE_URL 必须与这里的 server_name 完全一致
#   2. 必须透传 X-Forwarded-Proto，否则 request.base_url 会算成 http
#   3. 保留 Upgrade 头，Web UI 的扫码登录状态走 WebSocket
#   4. http2 on 需要 nginx >= 1.25.1，老版本改成 listen 443 ssl http2;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream we_rss_backend {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 80;
    server_name rss.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name rss.example.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    client_max_body_size 20m;

    # RSS 是纯文本 XML，压缩收益很大
    gzip on;
    gzip_types application/xml application/atom+xml application/json text/plain text/markdown;
    gzip_min_length 1024;
    gzip_comp_level 5;

    location / {
        proxy_pass http://we_rss_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # 订阅路径单独开缓冲，配合 ETag 让 Nginx 直出 304
    location ~ ^/(feed|rss)/ {
        proxy_pass http://we_rss_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_buffering on;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;

        add_header X-Robots-Tag "noindex" always;
    }
}
