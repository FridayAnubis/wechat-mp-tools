# WeChat MP Tools 反向代理示例
# 放到 /etc/nginx/conf.d/wechat-mp-tools.conf，改 server_name 后 nginx -t && nginx -s reload
#
# 这个应用本身没有登录鉴权（原设计是跑在本机的桌面应用），
# 一旦暴露到公网必须自己加一道门：下面用 HTTP Basic Auth 保护整个 UI，
# 只把 RSS 路径放行，由应用侧的 RSS_TOKEN 负责鉴权。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream wechat_mp_tools {
    server 127.0.0.1:5200;
    keepalive 16;
}

server {
    listen 80;
    server_name mp.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mp.example.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    client_max_body_size 50m;

    gzip on;
    gzip_types application/xml application/atom+xml application/json text/plain text/css application/javascript;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # 生成密码文件：htpasswd -c /etc/nginx/.htpasswd yourname
    auth_basic           "WeChat MP Tools";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # RSS 订阅地址放行给阅读器，鉴权交给应用的 RSS_TOKEN
    location ~ ^/api/articles/rss(/|$) {
        auth_basic off;

        proxy_pass http://wechat_mp_tools;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_buffering on;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;

        add_header X-Robots-Tag "noindex" always;
    }

    location / {
        proxy_pass http://wechat_mp_tools;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 抓取/下载接口可能跑得久，别用默认 60s 掐断
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
